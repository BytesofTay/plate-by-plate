<title>Plate by Plate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow app column under a sticky header; cards only for exercises; a rest-timer dock at the bottom. */
:root {
  --bg: #ECEFF2; --surface: #FFFFFF; --sunken: #E1E6EA; --ink: #14181D; --muted: #5A6570; --line: #D3D9DF;
  --accent: #C8102E; --accent-ink: #FFFFFF; --accent-soft: #F8E2E5;
  --good: #17784A; --good-ink: #FFFFFF; --good-soft: #DCF0E4;
  --warn: #9A5B00; --warn-ink: #FFFFFF; --warn-soft: #F6E8CF;
  --p45: #1F4E9C; --p35: #E2B10C; --p25: #2E8B57; --p10: #FAFAF7; --p5: #2A2F35; --p2: #C8102E; --p1: #A9B1B9; --plate-edge: rgba(20,24,29,.28);
  --dock: #14181D; --dock-ink: #F2F4F6;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1216; --surface: #161B21; --sunken: #1D242B; --ink: #E7EBEE; --muted: #95A2AE; --line: #29323B;
  --accent: #FF5466; --accent-ink: #1B0508; --accent-soft: #3B151B;
  --good: #4CC38A; --good-ink: #08180F; --good-soft: #12301F;
  --warn: #F0A43A; --warn-ink: #1E1305; --warn-soft: #34250D;
  --p45: #3D73CF; --p35: #E9BC22; --p25: #3BA36A; --p10: #E9ECEE; --p5: #56606A; --p2: #FF5466; --p1: #8C969F; --plate-edge: rgba(0,0,0,.5);
  --dock: #E7EBEE; --dock-ink: #0E1216;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1216; --surface: #161B21; --sunken: #1D242B; --ink: #E7EBEE; --muted: #95A2AE; --line: #29323B;
  --accent: #FF5466; --accent-ink: #1B0508; --accent-soft: #3B151B;
  --good: #4CC38A; --good-ink: #08180F; --good-soft: #12301F;
  --warn: #F0A43A; --warn-ink: #1E1305; --warn-soft: #34250D;
  --p45: #3D73CF; --p35: #E9BC22; --p25: #3BA36A; --p10: #E9ECEE; --p5: #56606A; --p2: #FF5466; --p1: #8C969F; --plate-edge: rgba(0,0,0,.5);
  --dock: #E7EBEE; --dock-ink: #0E1216;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.gut { max-width: 760px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .gut { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding-block: 12px 0; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
.brand svg { flex: none; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 27px; letter-spacing: .035em; text-transform: uppercase; line-height: 1; }
.status { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .02em; display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status[data-tone="good"]::before { background: var(--good); }
.status[data-tone="warn"]::before { background: var(--warn); }
.tabs { display: flex; width: 100%; gap: 2px; margin-top: 6px; overflow-x: auto; }
.tab { padding: 10px 12px 9px; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted); white-space: nowrap; text-decoration: none; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main.gut { padding-block: 22px 150px; display: grid; gap: 22px; }

/* Shared bits */
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 9vw, 56px); line-height: .95; text-transform: uppercase; letter-spacing: .01em; }
.h2 { font-family: var(--display); font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
.muted { color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:disabled { opacity: .45; }
.btn.danger { color: var(--accent); border-color: var(--accent); }
.btn.block { width: 100%; min-height: 54px; font-size: 16px; }
.pill { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.plain { background: var(--sunken); color: var(--muted); }
.note { background: var(--sunken); border-radius: var(--r); padding: 14px 16px; font-size: 14px; }

/* Today */
.daypick { display: flex; flex-wrap: wrap; gap: 8px; }
.daychip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.daychip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.daychip .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--accent); }
.daychip[aria-pressed="true"] .tag { color: inherit; opacity: .8; }
.session-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.session-head > div { min-width: 0; }
.tally { text-align: right; }
.tally b { font-family: var(--display); font-size: 34px; line-height: 1; }
.exlist { display: grid; gap: 14px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.ex.is-main { border-color: var(--ink); }
.ex-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.ex-title { display: grid; gap: 2px; min-width: 0; }
.ex-title h3 { font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; }
.ex.is-main .ex-title h3 { font-size: 30px; font-weight: 800; }
.scheme { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 4px; background: var(--sunken); border-radius: 999px; padding: 4px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; font-size: 20px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); }
.stepper output { min-width: 84px; text-align: center; display: grid; line-height: 1.1; }
.stepper output b { font-family: var(--display); font-weight: 800; font-size: 26px; }
.stepper output small { font-size: 11px; color: var(--muted); }
.bw { font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--sunken); padding: 8px 12px; border-radius: 999px; }
.loadrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.loadout { display: flex; align-items: center; height: 56px; }
.loadout .shaft { width: 26px; height: 6px; background: var(--p1); border-radius: 2px 0 0 2px; }
.loadout .collar { width: 6px; height: 18px; background: var(--p1); margin-right: 2px; border-radius: 2px; }
.loadout .plate { width: var(--w); height: var(--h); border-radius: 3px; margin-right: 2px; box-shadow: inset 0 0 0 1px var(--plate-edge); }
.loadout .sleeve { width: 22px; height: 9px; background: var(--p1); border-radius: 0 3px 3px 0; }
.p45 { background: var(--p45); } .p35 { background: var(--p35); } .p25 { background: var(--p25); } .p10 { background: var(--p10); } .p5 { background: var(--p5); } .p2 { background: var(--p2); } .p1 { background: var(--p1); }
.loadtext { font-size: 14px; }
.loadtext .num { font-weight: 500; }
.warm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px dashed var(--line); color: var(--muted); }
.chip.on { border-style: solid; border-color: var(--ink); color: var(--ink); text-decoration: line-through; }
.sets { display: flex; flex-wrap: wrap; gap: 10px; }
.set { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 24px; display: grid; place-items: center; transition: transform .12s ease; }
.set:active { transform: scale(.94); }
.set .ghost { color: var(--muted); opacity: .55; font-size: 20px; }
.set.hit { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.set.ok { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.set.short { background: var(--warn); border-color: var(--warn); color: var(--warn-ink); }
.set small { font-size: 13px; font-weight: 700; }
.ex-foot { display: grid; gap: 4px; font-size: 13px; }
.ex-foot .cue { color: var(--muted); }
.finish { display: grid; gap: 8px; text-align: center; }

.summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.sumrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.sumrow .msg { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.sumrow b { font-weight: 600; }

/* Morning routine */
.morning { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.morning.done { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 12px 16px; }
.morning.done p { flex: 1 1 200px; font-size: 14px; }
.mhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; }
.mlist li + li { border-top: 1px solid var(--line); }
.check { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 10px 0; }
.check .box { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; }
.check.on .box { background: var(--good); border-color: var(--good); }
.check.on .box::after { content: ""; width: 6px; height: 11px; border: solid var(--good-ink); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.check .mt { display: grid; gap: 1px; min-width: 0; }
.check .mt b { font-weight: 600; }
.check.on .mt b { color: var(--muted); }
.check.toggle.on .mt b { color: var(--ink); }
.check .mh { font-size: 13px; color: var(--muted); }
.linkbtn { color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.glute-tag { color: var(--accent); font-weight: 600; }
.gdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 2px; }
.gdot.off { background: transparent; }
.mguide { display: grid; gap: 12px; }
.mguide dl { margin: 0; display: grid; gap: 12px; }
.mguide dt { font-weight: 600; }
.mguide dd { margin: 2px 0 0; font-size: 14px; color: var(--muted); max-width: 65ch; }
.mguide ul { margin: 0; padding-left: 20px; font-size: 14px; display: grid; gap: 4px; }

/* Program */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { border-radius: 8px; padding: 8px 6px; text-align: center; background: var(--sunken); color: var(--muted); min-width: 0; }
.wd.train { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.wd .d { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.wd .n { font-weight: 600; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px 28px; }
.day h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 4px; }
.day h3 span:first-child { font-family: var(--display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: .02em; }
.day ul { list-style: none; margin: 0; padding: 0; }
.day li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.day li.main { font-weight: 600; }
.day li .num { font-size: 12px; color: var(--muted); white-space: nowrap; }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 65ch; }

/* Progress */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile.feature { grid-column: span 2; border-color: var(--accent); }
.tile.feature .big { font-size: 52px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; min-width: 0; }
.tile .big { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; }
.tile .big small { font-size: 16px; font-weight: 700; margin-left: 2px; }
.tile .delta { font-size: 13px; font-weight: 600; color: var(--good); }
.tile .delta.flat { color: var(--muted); font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.chartwrap { overflow-x: auto; }
.chart { width: 100%; max-width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.chart .line { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); fill-opacity: .09; stroke: none; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dot.end { fill: var(--accent); }
.chart .endlabel { fill: var(--ink); font-family: var(--mono); font-size: 12px; font-weight: 500; }
.liftpick { display: flex; flex-wrap: wrap; gap: 6px; }
.weeks { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.wk { display: grid; gap: 6px; justify-items: center; min-width: 0; }
.pips { display: grid; grid-template-columns: repeat(2, 12px); gap: 3px; }
.pip { width: 12px; height: 12px; border-radius: 3px; background: var(--sunken); }
.pip.on { background: var(--ink); }
.wk .lbl { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.history { display: grid; }
.history details { border-top: 1px solid var(--line); }
.history summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 12px 0; }
.history summary::-webkit-details-marker { display: none; }
.history summary .when { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.history summary .what { font-weight: 600; min-width: 0; }
.history summary .main { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.history table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
.history td { padding: 5px 0; border-top: 1px dashed var(--line); vertical-align: top; }
.history td:nth-child(2) { font-family: var(--mono); text-align: right; white-space: nowrap; padding-left: 12px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; }
.confirm p { flex: 1 1 220px; font-size: 14px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty b { color: var(--ink); font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }

/* Setup */
.seg { display: inline-flex; flex-wrap: wrap; background: var(--sunken); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.field { display: grid; gap: 8px; }
.field > label, .field > .lab { font-weight: 600; }
.wtable { display: grid; gap: 18px; }
.wgroup h4 { margin: 0 0 4px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.wrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.wrow label { font-size: 14px; min-width: 0; }
.wrow .inp { display: flex; align-items: center; gap: 6px; flex: none; }
.wrow input { width: 76px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 14px; text-align: right; }
.wrow .unit { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 58px; }

/* Rest timer dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--dock); color: var(--dock-ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .bar { height: 4px; background: var(--accent); transform-origin: left; }
.dock .gut { display: flex; align-items: center; gap: 12px; padding-block: 10px 12px; }
.dock .t { font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1; min-width: 84px; font-variant-numeric: tabular-nums; }
.dock .what { flex: 1 1 auto; min-width: 0; font-size: 13px; line-height: 1.3; }
.dock .what b { display: block; font-size: 14px; }
.dock button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid currentColor; font-weight: 600; font-size: 14px; white-space: nowrap; }

@media (max-width: 640px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stepper output { min-width: 70px; }
}
@media (max-width: 420px) {
  .wd .n { font-size: 11px; }
  .set { width: 52px; height: 52px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="gut">
    <div class="brand">
      <svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true">
        <rect x="0" y="10" width="34" height="2" rx="1" fill="currentColor"/>
        <rect x="5" y="2" width="5" height="18" rx="1.5" fill="var(--accent)"/>
        <rect x="11" y="6" width="3" height="10" rx="1" fill="currentColor"/>
        <rect x="24" y="2" width="5" height="18" rx="1.5" fill="var(--accent)"/>
        <rect x="20" y="6" width="3" height="10" rx="1" fill="currentColor"/>
      </svg>
      <span class="wordmark">Plate by Plate</span>
    </div>
    <span class="status" id="status" data-tone="plain" role="status">Loading</span>
    <nav class="tabs" aria-label="Sections">
      <a class="tab" href="#today" data-view="today">Today</a>
      <a class="tab" href="#program" data-view="program">Program</a>
      <a class="tab" href="#progress" data-view="progress">Progress</a>
      <a class="tab" href="#setup" data-view="setup">Setup</a>
    </nav>
  </div>
</header>

<main class="gut" id="app" aria-live="polite"></main>

<div class="dock" id="dock" hidden>
  <div class="bar" id="dockbar"></div>
  <div class="gut">
    <span class="t" id="dockt">3:00</span>

// ---------- Rest timer ----------
let T = null, audio = null, wake = null;
function ensureAudio() { try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) {} }
function beep() {
  try { if (!audio) return; [0, 0.25].forEach(off => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.0001, audio.currentTime + off); g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + off + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + off + 0.18); o.connect(g); g.connect(audio.destination); o.start(audio.currentTime + off); o.stop(audio.currentTime + off + 0.2); }); } catch (e) {}

}

  document.getElementById("dock").hidden = false;

}
function tick() {
  if (!T) return;
  const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
  const m = Math.floor(left / 60), s = left % 60;
  document.getElementById("dockt").textContent = `${m}:${String(s).padStart(2, "0")}`;
  document.getElementById("dockbar").style.transform = `scaleX(${T.total ? left / T.total : 0})`;
  const what = document.getElementById("dockwhat");
  if (left <= 0) {
    if (!T.over) { T.over = true; beep(); }
    what.innerHTML = `<b>Rest's over</b>${esc(T.label)}`;
    T.h = setTimeout(stopTimer, 8000);

  }

}
function stopTimer() { if (T) clearTimeout(T.h); T = null; document.getElementById("dock").hidden = true; }

// ---------- Actions ----------
function cycle(ex, v) {
  const step = ex.unit === "sec" ? 5 : 1;
  if (v == null) return ex.repsMax;
  const n = v - step;
  return n < 0 ? null : n;
}
function finishWorkout() {
  const dayId = S.selDay || nextDayId();
  const day = dayById(dayId);
  const d = draftFor(dayId);
  const before = { weights: { ...S.profile.weights }, failStreak: { ...S.profile.failStreak }, nextDay: S.profile.nextDay };
  const logged = [];
  for (const ex of day.exercises) {
    const reps = (d.reps[ex.id] || []).filter(v => v != null);
    if (!reps.length) continue;
    const w = weightFor(dayId, ex.id);
    const p = progress(ex, w, reps, S.profile.failStreak[ex.id] || 0, S.profile.settings);
    S.profile.weights[ex.id] = p.next;
    S.profile.failStreak[ex.id] = p.streak;
    logged.push({ exerciseId: ex.id, weight: w, reps, result: p.result, message: p.message });
  }
  if (!logged.length) return;
  const now = new Date();
  const sess = { id: "s" + now.getTime().toString(36), ts: now.getTime(), date: localDate(now), dayId, exercises: logged, before };
  S.profile.nextDay = (ROTATION.indexOf(dayId) + 1) % 4;
  S.sessions = [...S.sessions, sess];
  delete S.drafts[dayId]; saveDrafts();
  S.summary = sess; S.selDay = null;
  stopTimer();
  persistSession(sess); persistProfile();
  render(); window.scrollTo(0, 0);
}
function undoLast() {
  const last = S.sessions[S.sessions.length - 1];
  if (!last) return;
  if (last.before) S.profile = normalizeProfile({ ...S.profile, ...last.before });
  S.sessions = S.sessions.slice(0, -1);
  S.confirm = null;
  deleteSession(last.id); persistProfile();
  render();
}
function resetAll() {
  const ids = S.sessions.map(s => s.id);
  S.sessions = []; S.profile = freshProfile(); S.drafts = {}; saveDrafts(); S.confirm = null; S.summary = null;
  ids.forEach(deleteSession); persistProfile();
  render();
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  const dayId = S.selDay || nextDayId();
  if (act === "day") { S.selDay = v === nextDayId() ? null : v; render(); }
  else if (act === "set") {
    const ex = EX[b.dataset.ex], i = +b.dataset.i;
    const d = draftFor(dayId, true);
    const arr = d.reps[ex.id] || (d.reps[ex.id] = Array(ex.sets).fill(null));
    const was = arr[i];
    arr[i] = cycle(ex, was);
    saveDrafts();
    ensureAudio(); keepAwake();
    if (was == null && arr[i] != null) {
      const day = dayById(dayId);
      const idx = day.exercises.indexOf(ex);
      const nextSet = arr.findIndex(x => x == null);
      const label = nextSet >= 0 ? `Next: ${ex.name}, set ${nextSet + 1}` : idx < day.exercises.length - 1 ? `Next: ${day.exercises[idx + 1].name}` : "Last set done. Finish and save.";
      startTimer(ex.restSec, label);
    }
    render();
  }
  else if (act === "wt") {
    const ex = EX[b.dataset.ex], s = S.profile.settings;
    const d = draftFor(dayId, true);
    const cur = weightFor(dayId, ex.id);
    let n = r2(cur + (+b.dataset.d) * stepFor(ex, s));
    if (ex.kind === "barbell") n = Math.max(s.barWeight, n);
    d.weights[ex.id] = Math.max(0, n);
    saveDrafts(); render();
  }
  else if (act === "warm") {
    const d = draftFor(dayId, true);
    const arr = d.warm[b.dataset.ex] || (d.warm[b.dataset.ex] = []);
    arr[+b.dataset.i] = !arr[+b.dataset.i];
    saveDrafts(); render();
  }
  else if (act === "finish") finishWorkout();
  else if (act === "summary-done") { S.summary = null; render(); window.scrollTo(0, 0); }
  else if (act === "lift") { S.chartLift = v; render(); }
  else if (act === "undo") { S.confirm = "undo"; render(); }
  else if (act === "undo-yes") undoLast();
  else if (act === "reset") { S.confirm = "reset"; render(); }
  else if (act === "reset-yes") resetAll();
  else if (act === "cancel") { S.confirm = null; render(); }
  else if (act === "morning") {
    const key = todayKey();
    const m = S.profile.morning && S.profile.morning.date === key ? S.profile.morning : { date: key, done: {} };
    m.done = { ...m.done, [v]: !m.done[v] };
    S.profile.morning = m;
    if (morningItems().every(i => m.done[i.id])) S.morningOpen = false;
    persistProfile(); render();
  }
  else if (act === "morning-open") { S.morningOpen = true; render(); }
  else if (act === "morning-item") {
    const on = S.profile.morningItems.includes(v);
    S.profile.morningItems = on ? S.profile.morningItems.filter(id => id !== v) : MORNING.map(m => m.id).filter(id => id === v || S.profile.morningItems.includes(id));
    persistProfile(); render();
  }
  else if (act === "goto-mornings") {
    S.scrollTo = "mornings";
    if (S.view === "program") { render(); document.getElementById("mornings")?.scrollIntoView(); S.scrollTo = null; }
    else location.hash = "program";
  }
  else if (act === "bar") { S.profile.settings.barWeight = +v; persistProfile(); render(); }
  else if (act === "plate") { S.profile.settings.smallestPlate = +v; persistProfile(); render(); }
  else if (act === "timer-add") { if (T) { T.end = Math.max(T.end, Date.now()) + 30000; T.total += 30; T.over = false; clearTimeout(T.h); tick(); } }
  else if (act === "timer-stop") stopTimer();
});
document.addEventListener("change", ev => {
  const id = ev.target.dataset && ev.target.dataset.weight;
  if (!id) return;
  const n = parseFloat(ev.target.value);
  if (!isFinite(n) || n < 0) { ev.target.value = fmt(S.profile.weights[id]); return; }
  S.profile.weights[id] = r2(n);
  S.profile.failStreak[id] = 0;
  for (const k in S.drafts) delete S.drafts[k].weights[id];
  saveDrafts(); persistProfile();
});
window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  S.view = VIEWS.includes(v) ? v : "today"; S.confirm = null;
  render();
  const target = S.scrollTo && document.getElementById(S.scrollTo);
  S.scrollTo = null;
  if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && T) keepAwake(); });

render();
initStorage();
</script>
